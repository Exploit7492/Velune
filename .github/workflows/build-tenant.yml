name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to tenant config (e.g., configs/acme123.json)'
        required: true
        default: 'configs/example.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install dependencies (jq, curl, imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl imagemagick
          chmod +x gradlew

      - name: Determine config file
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CONFIG="${{ github.event.inputs.config_file }}"
          else
            CONFIG=$(git diff --name-only HEAD^ HEAD | grep '^configs/.*\.json$' | head -1)
          fi
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "CONFIG_FILE=$CONFIG" >> $GITHUB_ENV

      - name: Run branding script
        if: env.CONFIG_FILE != ''
        run: ./scripts/brand.sh "$CONFIG_FILE"

      - name: Read package name, API key, tenant ID, and app name
        run: |
          if [ -f scripts/brand.env ]; then
            source scripts/brand.env
            echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
            echo "PAWNS_API_KEY=$PAWNS_API_KEY" >> $GITHUB_ENV
            echo "TENANT_ID=$TENANT_ID" >> $GITHUB_ENV
            echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          else
            # Default values for master build
            APP_NAME=$(grep -o '<string name="app_name">[^<]*</string>' app/src/main/res/values/strings.xml | sed 's/<string name="app_name">\(.*\)<\/string>/\1/')
            echo "PACKAGE_NAME=com.nikhil.yt" >> $GITHUB_ENV
            echo "PAWNS_API_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzZGsiOnRydWUsImV4cCI6MjEwMTU3Mzg5NSwianRpIjoiMDFLWkhBQTNRR1RUQzlLSktHVzdHUlNYVzkiLCJpYXQiOjE3ODYyMTM4OTUsInN1YiI6IjAxS0hCOFJaTk41SzIzVjU0VFdXMjZQS1I3In0.i6lfrMveuglFgWKVDEKLHwpp_GkqcUlmVGJ1_Fv9Gjk" >> $GITHUB_ENV
            echo "TENANT_ID=master" >> $GITHUB_ENV
            echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          fi

      - name: Build APK
        run: |
          ./gradlew assembleRelease \
            -PappPackage=${{ env.PACKAGE_NAME }} \
            -PpawnsApiKey=${{ env.PAWNS_API_KEY }}

      - name: Sign APK (if keystore provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore provided, skipping signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore keystore.jks -storepass "$KEYSTORE_PASSWORD" \
            app/build/outputs/apk/release/app-release-unsigned.apk "$KEY_ALIAS"
          zipalign -v 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          rm keystore.jks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.APP_NAME == 'YT-Pro' && format('v1.0.{0}', github.run_number) || format('{0}-v{1}', env.APP_NAME, github.run_number) }}
          name: "${{ env.APP_NAME == 'YT-Pro' && format('YT-Pro v1.0.{0}', github.run_number) || format('{0} - Build {1}', env.APP_NAME, github.run_number) }}"
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
