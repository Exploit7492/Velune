name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to tenant config (e.g., configs/acme123.json)'
        required: true
        default: 'configs/example.json'

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── Cache apt packages ──────────────────────────────────────────────
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      # ─── Create Gradle wrapper with correct version ──────────────────────
      - name: Setup Gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOW'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOW
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      # ─── Cache Gradle dependencies ────────────────────────────────────────
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── Cache Android SDK ────────────────────────────────────────────────
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install dependencies (jq, curl, imagemagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl imagemagick
          chmod +x gradlew

      - name: Determine config file
        id: config
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            CONFIG="${{ github.event.inputs.config_file }}"
          else
            CONFIG=$(git diff --name-only HEAD^ HEAD | grep '^configs/.*\.json$' | head -1)
          fi
          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "CONFIG_FILE=$CONFIG" >> $GITHUB_ENV

      - name: Run branding script
        if: env.CONFIG_FILE != ''
        env:
          DEFAULT_PAWNS_API_KEY: ${{ secrets.PAWNS_API_KEY }}
        run: ./scripts/brand.sh "$CONFIG_FILE"

      - name: Read package name, API key, tenant ID, and app name
        env:
          DEFAULT_PAWNS_API_KEY: ${{ secrets.PAWNS_API_KEY }}
        run: |
          if [ -f scripts/brand.env ]; then
            source scripts/brand.env
            echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
            echo "PAWNS_API_KEY=$PAWNS_API_KEY" >> $GITHUB_ENV
            echo "TENANT_ID=$TENANT_ID" >> $GITHUB_ENV
            echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          else
            APP_NAME=$(grep -o '<string name="app_name">[^<]*</string>' app/src/main/res/values/strings.xml | sed 's/<string name="app_name">\(.*\)<\/string>/\1/')
            echo "PACKAGE_NAME=com.nikhil.yt" >> $GITHUB_ENV
            # Master/default (unbranded) build, no scripts/brand.env at
            # all — same shared default key as brand.sh's own fallback
            # above, sourced from the same GitHub Actions secret rather
            # than the literal value that used to be hardcoded on this
            # exact line. See app/build.gradle.kts's PAWNS_API_KEY
            # comment for the rotation note this depends on.
            echo "PAWNS_API_KEY=$DEFAULT_PAWNS_API_KEY" >> $GITHUB_ENV
            echo "TENANT_ID=master" >> $GITHUB_ENV
            echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          fi

      - name: Build APK with custom package name
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ./gradlew assembleArm64Release \
            -PappPackage=${{ env.PACKAGE_NAME }} \
            -PpawnsApiKey=${{ env.PAWNS_API_KEY }}

      - name: Sign APK (if keystore provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore provided, skipping signing"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          ZIPALIGN=$(find "$ANDROID_HOME" -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found under \$ANDROID_HOME, searching whole filesystem..."
            ZIPALIGN=$(find / -name zipalign -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$ZIPALIGN" ]; then
            echo "::error::zipalign binary could not be located on this runner"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found under \$ANDROID_HOME, searching whole filesystem..."
            APKSIGNER=$(find / -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner binary could not be located on this runner"
            exit 1
          fi
          echo "Using zipalign at: $ZIPALIGN"
          echo "Using apksigner at: $APKSIGNER"
          "$ZIPALIGN" -v -p 4 \
            app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk \
            app/build/outputs/apk/arm64/release/app-arm64-release-aligned.apk
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app/build/outputs/apk/arm64/release/app-arm64-release.apk \
            app/build/outputs/apk/arm64/release/app-arm64-release-aligned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/arm64/release/app-arm64-release.apk
          rm app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk
          rm app/build/outputs/apk/arm64/release/app-arm64-release-aligned.apk
          rm keystore.jks

      - name: Compute semantic version
        id: semver
        run: |
          run_num=${{ github.run_number }}
          major=$((run_num / 10000))
          minor=$(((run_num / 100) % 100))
          patch=$((run_num % 100))
          echo "version=${major}.${minor}.${patch}" >> $GITHUB_OUTPUT
          echo "VERSION=${major}.${minor}.${patch}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TENANT_ID == 'master' && format('v{0}', env.VERSION) || format('{0}-v{1}', env.APP_NAME, env.VERSION) }}
          name: "${{ env.APP_NAME }} - Build ${{ env.VERSION }}"
          files: app/build/outputs/apk/arm64/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
